
name: ML Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: "Failure demonstration"
        type: choice
        default: none
        options:
          - none
          - data
          - model
          - security

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt && python -m pip install ruff bandit pip-audit

      - name: Ruff
        run: ruff check src/ tests/

      - name: Bandit
        run: python -m bandit -r src/

      - name: Pytest
        run: python -m pytest tests/ -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Data quality gate
        run: python -m src.data_gate

      - name: Demo data failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo == 'data' }}
        run: python -c "import pandas as pd; from src.data_gate import validate; validate(pd.DataFrame({'bad':[1]}), 1, 0.35)"

      - name: Model quality gate
        run: python -m src.model_gate

      - name: Demo model failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo == 'model' }}
        run: python -m src.model_gate --demo-weak

      - name: Check model SHA256
        run: cd models && sha256sum -c baseline.sha256

      - name: Build Docker image
        run: docker build -t ml-project:lab4 .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ml-project:lab4
          format: json
          output: trivy-image.json
          exit-code: "0"
          severity: CRITICAL

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: json
          output: trivy-config.json
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Security gate
        run: python -m src.security_gate trivy-image.json trivy-config.json

      - name: Demo security failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo == 'security' }}
        run: python -m src.security_gate tests/trivy_demo_critical.json

      - name: Check container user
        run: test "$(docker run --rm --entrypoint id ml-project:lab4 -u)" != "0"

      - name: Docker smoke test
        run: docker run -d --name ml-api-ci -p 127.0.0.1:8000:8000 -e API_TOKEN=ci-only-test-token ml-project:lab4 && curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8000/health && docker rm -f ml-api-ci

      - name: Save commit and model hash
        run: git rev-parse HEAD > ci-commit.txt && sha256sum models/baseline.joblib > ci-model.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            metrics/baseline.json
            models/baseline.sha256
            trivy-image.json
            trivy-config.json
            ci-commit.txt
            ci-model.sha256
          if-no-files-found: warn
          retention-days: 7

